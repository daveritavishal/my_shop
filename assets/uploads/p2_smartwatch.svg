<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="watchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#watchGrad)" />
  <g transform="translate(160, 50)">
    <!-- Straps -->
    <rect x="25" y="10" width="30" height="35" rx="4" fill="#334155" />
    <rect x="25" y="125" width="30" height="35" rx="4" fill="#334155" />
    <!-- Watch Body -->
    <rect x="10" y="35" width="60" height="95" rx="18" fill="#0f172a" stroke="#94a3b8" stroke-width="3" />
    <!-- Screen -->
    <rect x="16" y="45" width="48" height="75" rx="10" fill="#0284c7" />
    <!-- Heart rate icon -->
    <path d="M 32 80 L 36 74 L 40 86 L 44 80 L 48 80" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="40" y="65" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">10:45</text>
  </g>
  <text x="200" y="240" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="1">SMART FITNESS WATCH</text>
  <text x="200" y="265" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">SpO2 &amp; Heart Rate Tracking</text>
</svg>
