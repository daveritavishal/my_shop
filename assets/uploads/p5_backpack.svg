<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="packBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#packBg)" />
  <g transform="translate(145, 55)">
    <!-- Handle -->
    <path d="M 40 25 A 15 15 0 0 1 70 25" fill="none" stroke="#064e3b" stroke-width="6" stroke-linecap="round" />
    <!-- Main bag -->
    <rect x="15" y="25" width="80" height="110" rx="20" fill="#34d399" stroke="#ffffff" stroke-width="4" />
    <!-- Front pocket -->
    <rect x="25" y="70" width="60" height="55" rx="10" fill="#065f46" stroke="#ffffff" stroke-width="2" />
    <!-- Zipper line -->
    <line x1="30" y1="85" x2="80" y2="85" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="4 2" />
  </g>
  <text x="200" y="240" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="1">MINIMALIST BACKPACK</text>
  <text x="200" y="265" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Water-Resistant Laptop Sleeve</text>
</svg>
